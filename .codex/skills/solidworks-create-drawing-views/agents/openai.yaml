interface:
  display_name: "SolidWorks 工程图视图"
  short_description: "显式规划、发布并核验 SolidWorks 关联工程图视图"
  default_prompt: "使用 $solidworks-create-drawing-views，根据初始化交接制品显式规划、发布并核验 SolidWorks 工程图视图。"

dependencies:
  tools:
    - type: "mcp"
      value: "solidpilot"
      description: "仓库提供的 SolidWorks 工程语义 MCP 服务"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
